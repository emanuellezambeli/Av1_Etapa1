<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Candidatos - PDC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Registro de Candidatos - PDC (93)</h1>

    <div class="form-group">
      <label for="txtNumeroPartido">Número do Partido:</label>
      <input
        type="text"
        id="txtNumeroPartido"
        placeholder="Digite 93"
        onchange="processarPartido()"
      />
      <span id="msgErroPartido" class="erro"></span>
    </div>

    <div class="form-group">
      <label>Nome do Partido:</label>
      <span id="lblNomePartido"><b>---</b></span>
    </div>

    <div class="form-group">
      <label for="lstCandidatos">Candidato:</label>
      <select
        id="lstCandidatos"
        size="5"
        onchange="selecionarCandidato()"
      ></select>
    </div>

    <div class="form-group">
      <label for="lstCargos">Cargo a Concorrer:</label>
      <select id="lstCargos" size="5">
        <option value="Presidente">Presidente</option>
        <option value="Governador(a)">Governador(a)</option>
        <option value="Senador(a)">Senador(a)</option>
        <option value="Deputado(a) Federal">Deputado(a) Federal</option>
        <option value="Deputado(a) Estadual">Deputado(a) Estadual</option>
      </select>
    </div>

    <div class="form-group">
      <label for="txtNumeroCandidato">Número do Candidato:</label>
      <input type="text" id="txtNumeroCandidato" placeholder="Ex: 93XX" />
      <span class="rules">
        Regra PDC (93):<br />
        - Presidente: 93 + 2 dígitos (4 total)<br />
        - Senador(a): 93 + 3 dígitos (5 total)<br />
        - Governador(a) / Dep. Fed.: 93 + 4 dígitos (6 total)<br />
        - Dep. Estadual: 93 + 5 dígitos (7 total)
      </span>
      <span id="msgErroNumero" class="erro"></span>
    </div>

    <!-- PAINEL ADICIONADO AQUI: É ele que desenha a foto e as infos na tela -->
    <div id="painelCandidato" class="card-candidato" style="display: none">
      <h3>Dados do Candidato</h3>
      <p><b>Nome:</b> <span id="infoNome"></span></p>
      <p><b>Cargo:</b> <span id="infoCargo"></span></p>
      <p><b>Número:</b> <span id="infoNumero"></span></p>
      <div>
        <img id="infoFoto" src="" alt="Foto do Candidato" />
      </div>
    </div>

    <div class="actions">
      <button
        type="button"
        class="btn-primary"
        onclick="registrarCandidatura()"
      >
        Registrar
      </button>
      <button type="button" class="btn-success" onclick="gravarEEnviarTSE()">
        Enviar ao TSE
      </button>
    </div>
    <span id="msgFeedbackAcao"></span>

    <script src="script.js"></script>
  </body>
</html>
